<h1>Contact Us</h1>
<p><b>Address:</b> 123 Hero Street, Durban, KZN, 4001</p>
<p><b>Phone:</b> 031 123 4567</p>
<p><b>Email:</b> info@littleheroes.org.za</p>

<h2>Find Us in Durban</h2>
<div id="map" style="height: 350px; width: 100%; border-radius: 8px; margin-bottom: 20px;"></div>
<h2>Send us a message</h2>
<form id="contactForm">
  <input type="text" placeholder="Your Name" required><br><br>
  <input type="email" placeholder="Your Email" required><br><br>
  <textarea placeholder="Your Message" required></textarea><br><br>
  <button type="submit">Send Message</button>
</form>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  var map = L.map('map').setView([-29.8587, 31.0218], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);
  L.marker([-29.8587, 31.0218]).addTo(map).bindPopup("Little Heroes NPO - 123 Hero Street, Durban").openPopup();
  
  document.getElementById('contactForm').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Thank you for contacting Little Heroes! We will reply soon.');
  });
</script>
<script src="script.js"></script>
</body>
</html>
